<nav class="site-nav">
    <!-- Logo -->
    <a href="index.html"><img src="images/logo.png" alt="Lauryn's Lovely Nails logo" class="logo" style="height:50px;"></a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="buy.html">Buy</a>
        <a href="nail-sizing.html">Nail Sizing</a>
        <a href="custom-designs.html">Custom</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<div class="container">
    <div class="left">
        <!-- Design image -->
        <img id="designImage" src="" alt="Design">
    </div>
    <div class="right">
        <h2 id="designName">Design Name</h2>

        <!-- Options -->
        <label for="length">Nail Length:</label>
        <select id="length">
            <option value="XXS">XXS</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="MM">MM</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL (+$1)</option>
            <option value="XXXL">XXXL (+$2)</option>
        </select>

        <label for="shape">Nail Shape:</label>
        <select id="shape">
            <option value="rounded">Rounded</option>
            <option value="square">Square</option>
            <option value="almond">Almond</option>
            <option value="coffin">Coffin</option>
            <option value="stiletto">Stiletto</option>
        </select>

        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" placeholder="Your full name">

        <label for="contact">Instagram or Gmail:</label>
        <input type="text" id="contact" placeholder="Your Instagram or Gmail">

        <div class="total">Total: $0</div>

        <button onclick="placeOrder()">Place Order</button>
    </div>
</div>

<script>
// Get URL parameters
const params = new URLSearchParams(window.location.search);
const designName = params.get('design') || 'Unknown Design';
const basePrice = parseFloat(params.get('price')) || 0;
let imgFile = params.get('img') || 'placeholder.png';

// Handle custom designs
if(designName.toLowerCase().includes("custom")) {
    imgFile = "custom.png"; // point to your custom design image
}

// Update name and image
document.getElementById('designName').textContent = designName;
document.getElementById('designImage').src = `images/${imgFile}`;

// Price calculation
const lengthEl = document.getElementById('length');
const totalEl = document.querySelector('.total');

function updateTotal() {
    let price = basePrice;
    if(lengthEl.value === "XXL") price += 1;
    if(lengthEl.value === "XXXL") price += 2;
    totalEl.textContent = `Total: $${price}`;
}

lengthEl.addEventListener('change', updateTotal);
updateTotal();

function placeOrder() {
    alert(`Order placed for ${designName}!\n${totalEl.textContent}\nName: ${document.getElementById('fullName').value}\nContact: ${document.getElementById('contact').value}`);
}
</script>
