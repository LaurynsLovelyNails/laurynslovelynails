<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order - Lauryn's Lovely Nails</title>
<link rel="stylesheet" href="styles.css">
<style>
body { font-family: 'Cormorant Garamond', serif; background-color: #fff0f5; margin:0; padding:0; }
.site-nav { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #ffe6f0; }
.site-nav .nav-links a { margin-left: 15px; text-decoration: none; color: #5c2a4d; font-weight: 700; }
.site-nav .nav-links a:hover { color: hotpink; }
.site-nav .logo { max-width: 220px; border-radius: 12px; }
.container { max-width: 900px; margin: 0 auto; padding: 20px; display: flex; flex-wrap: wrap; gap: 20px; }
.left, .right { flex:1 1 400px; }
.left img { width:100%; border-radius:12px; }
.right { display:flex; flex-direction:column; gap:10px; }
label { font-weight:700; }
select,input { padding:8px; border-radius:8px; border:1px solid #ccc; width:100%; }
.total { font-weight:700; font-size:20px; color:hotpink; margin-top:10px; }
button { background-color:#ff66b2; color:white; padding:10px; border:none; border-radius:12px; font-weight:700; cursor:pointer; }
button:hover { background-color:#ff99cc; }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="site-nav">
    <a href="index.html"><img src="images/logo.png" alt="Lauryn's Lovely Nails logo" class="logo"></a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="buy.html">Buy</a>
        <a href="nail-sizing.html">Nail Sizing</a>
        <a href="custom-designs.html">Custom</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<div class="container">
    <div class="left">
        <img id="designImage" src="https://via.placeholder.com/400x400.png?text=Design+Image" alt="Design">
    </div>
    <div class="right">
        <h2 id="designName">Design Name</h2>

        <label for="length">Nail Length:</label>
        <select id="length">
            <option value="XXS">XXS</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="MM">MM</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL (+$1)</option>
            <option value="XXXL">XXXL (+$2)</option>
        </select>

        <label for="shape">Nail Shape:</label>
        <select id="shape">
            <option value="rounded">Rounded</option>
            <option value="square">Square</option>
            <option value="almond">Almond</option>
            <option value="coffin">Coffin</option>
            <option value="stiletto">Stiletto</option>
        </select>

        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" placeholder="Your full name">

        <label for="contact">Instagram or Gmail:</label>
        <input type="text" id="contact" placeholder="Your Instagram or Gmail">

        <div class="total">Total: $0</div>

        <button onclick="placeOrder()">Place Order</button>
    </div>
</div>

<script>
// Read URL parameters
const params = new URLSearchParams(window.location.search);
const designNameParam = params.get('design') || 'Unknown Design';
const basePrice = parseFloat(params.get('price')) || 0;
const imgFile = params.get('img') || 'placeholder.png';

// Update image and design name
document.getElementById('designName').textContent = designNameParam;
document.getElementById('designImage').src = `images/${imgFile}`;

// Price calculation
const lengthEl = document.getElementById('length');
const totalEl = document.querySelector('.total');

function updateTotal() {
    let price = basePrice;
    if(lengthEl.value === "XXL") price +=1;
    if(lengthEl.value === "XXXL") price +=2;
    totalEl.textContent = `Total: $${price}`;
}

lengthEl.addEventListener('change', updateTotal);
updateTotal();

// Replace this with your Render backend URL
const BACKEND_URL = 'https://your-service.onrender.com/order';

function placeOrder() {
    const orderData = {
        customer_name: document.getElementById('fullName').value,
        customer_email: document.getElementById('contact').value,
        product: `${designNameParam} - ${lengthEl.value} - ${document.getElementById('shape').value} - Total: ${totalEl.textContent}`
    };

    fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(orderData)
    })
    .then(res => res.text())
    .then(msg => {
        alert(`✅ ${msg}`);
        // Optionally reset form
        document.getElementById('fullName').value = '';
        document.getElementById('contact').value = '';
        lengthEl.value = 'M';
        updateTotal();
    })
    .catch(err => {
        console.error(err);
        alert('❌ Failed to send order. Check console for details.');
    });
}
</script>

</body>
</html>
