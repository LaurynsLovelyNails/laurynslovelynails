<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order - Lauryn's Lovely Nails</title>
<link rel="stylesheet" href="styles.css">

<style>
body { background-color: #fff0f5; margin:0; padding:0; font-family: 'Cormorant Garamond', serif; }
.container { max-width:900px; margin:20px auto; padding:20px; display:flex; flex-wrap:wrap; gap:20px; }
.left, .right { flex:1 1 400px; }
.left img { width:100%; border-radius:12px; }
.right { display:flex; flex-direction:column; gap:12px; }
label { font-weight:700; }
select,input { padding:8px; border-radius:8px; border:1px solid #ccc; width:100%; }
.total { font-weight:700; font-size:20px; color:hotpink; margin-top:10px; }
button { background-color:#ff66b2; color:white; padding:10px; border:none; border-radius:12px; font-weight:700; cursor:pointer; }
button:hover { background-color:#ff99cc; }

/* NAVBAR */
.site-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: #ffe6f0;
    flex-wrap: wrap;
}
.site-nav .logo { max-width: 220px; border-radius: 12px; }
.nav-links { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.nav-links a {
    text-decoration: none;
    color: #5c2a4d;
    font-weight:700;
    padding:6px 12px;
    border-radius:12px;
    transition: all 0.2s;
}
.nav-links a:hover { background: #ff99cc; color:white; }
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="site-nav">
    <a href="index.html"><img src="images/logo.png" alt="Lauryn's Lovely Nails" class="logo"></a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="buy.html">Buy</a>
        <a href="nail-sizing.html">Nail Sizing</a>
        <a href="custom-designs.html">Custom</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<div class="container">

    <div class="left">
        <img id="designImage" src="" alt="Design Image">
    </div>

    <div class="right">
        <h2 id="designName">Design Name</h2>

        <label for="length">Nail Length:</label>
        <select id="length">
            <option value="XXS">XXS</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="MM">MM</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL (+$1)</option>
            <option value="XXXL">XXXL (+$2)</option>
        </select>

        <label for="shape">Nail Shape:</label>
        <select id="shape">
            <option value="rounded">Rounded</option>
            <option value="square">Square</option>
            <option value="almond">Almond</option>
            <option value="coffin">Coffin</option>
            <option value="stiletto">Stiletto</option>
        </select>

        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" placeholder="Your full name">

        <label for="contact">Instagram or Gmail:</label>
        <input type="text" id="contact" placeholder="Your Instagram or Gmail">

        <div class="total">Total: $0</div>

        <button onclick="placeOrder()">Place Order</button>
    </div>
</div>

<!-- Load product info -->
<script src="products.js"></script>

<script>
// Get product name from URL
const params = new URLSearchParams(window.location.search);
const designNameParam = params.get('design') || 'Unknown Design';

// Get matching product
const product = products.find(p => p.name === designNameParam);

// If no match found
if (!product) {
    document.getElementById('designName').textContent = "Unknown Design";
    document.getElementById('designImage').src = "images/design1.png";
} else {
    document.getElementById('designName').textContent = product.name;
    document.getElementById('designImage').src = product.img;   // FIXED: no double “images/images”
    document.getElementById('designImage').alt = product.name;
}

// Price calculation
const basePrice = product ? product.price : 0;
const lengthEl = document.getElementById('length');
const totalEl = document.querySelector('.total');

function updateTotal() {
    let price = basePrice;
    if (lengthEl.value === "XXL") price += 1;
    if (lengthEl.value === "XXXL") price += 2;
    totalEl.textContent = `Total: $${price}`;
}
lengthEl.addEventListener('change', updateTotal);
updateTotal();

// Send order
function placeOrder() {
    const fullName = document.getElementById('fullName').value.trim();
    const contact = document.getElementById('contact').value.trim();
    const shape = document.getElementById('shape').value;
    const length = document.getElementById('length').value;

    if (!contact) {
        alert("Please enter your Instagram or Gmail.");
        return;
    }

    const orderInfo = `
Design: ${product.name}
Price: ${totalEl.textContent.replace("Total: ","")}
Length: ${length}
Shape: ${shape}
Name: ${fullName}
Contact: ${contact}
`;

    fetch("http://localhost:3000/order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            customer_name: fullName,
            customer_email: contact,
            product: orderInfo
        })
    })
    .then(res => {
        if (res.ok) {
            alert("Order placed successfully!");
        } else {
            alert("Failed to send order.");
        }
    })
    .catch(err => {
        console.error(err);
        alert("Failed to send order.");
    });
}
</script>

</body>
</html>
