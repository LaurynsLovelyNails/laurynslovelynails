<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order - Lauryn's Lovely Nails</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- NAV BAR -->
<nav class="site-nav">
    <a href="index.html"><img src="images/logo.png" alt="Lauryn's Lovely Nails logo" class="logo"></a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="buy.html">Buy</a>
        <a href="nail-sizing.html">Nail Sizing</a>
        <a href="custom-designs.html">Custom</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<div class="container">
    <div class="left">
        <img id="designImage" src="https://via.placeholder.com/400x400.png?text=Design+Image" alt="Design">
    </div>
    <div class="right">
        <h2 id="designName">Design Name</h2>

        <label for="length">Nail Length:</label>
        <select id="length">
            <option value="XXS">XXS</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="MM">MM</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL (+$1)</option>
            <option value="XXXL">XXXL (+$2)</option>
        </select>

        <label for="shape">Nail Shape:</label>
        <select id="shape">
            <option value="rounded">Rounded</option>
            <option value="square">Square</option>
            <option value="almond">Almond</option>
            <option value="coffin">Coffin</option>
            <option value="stiletto">Stiletto</option>
        </select>

        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" placeholder="Your full name">

        <label for="contact">Instagram or Gmail:</label>
        <input type="text" id="contact" placeholder="Your Instagram or Gmail">

        <div class="total">Total: $0</div>

        <button id="placeOrderBtn">Place Order</button>
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const designName = params.get('design') || 'Unknown Design';
const designImg = params.get('img') || 'design1.png';
const basePrice = parseFloat(params.get('price')) || 0;

// Update name and image
document.getElementById('designName').textContent = designName;
document.getElementById('designImage').src = `images/${designImg}`;

// Price calculation
const lengthEl = document.getElementById('length');
const totalEl = document.querySelector('.total');

function updateTotal() {
    let price = basePrice;
    if(lengthEl.value === "XXL") price +=1;
    if(lengthEl.value === "XXXL") price +=2;
    totalEl.textContent = `Total: $${price}`;
}

lengthEl.addEventListener('change', updateTotal);
updateTotal();

// Render backend URL
const BACKEND_URL = "https://your-backend.onrender.com/order"; // <-- Replace with your Render URL

document.getElementById('placeOrderBtn').addEventListener('click', () => {
    const orderData = {
        customer_name: document.getElementById('fullName').value,
        customer_email: document.getElementById('contact').value,
        product: `${designName} - ${lengthEl.value} / ${document.getElementById('shape').value} - $${basePrice}`
    };

    fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(orderData)
    })
    .then(res => res.text())
    .then(response => alert("✅ " + response))
    .catch(err => {
        console.error(err);
        alert("❌ Something went wrong. Check console for details.");
    });
});
</script>

</body>
</html>
