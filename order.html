<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order - Lauryn's Lovely Nails</title>
<link rel="stylesheet" href="styles.css">

<style>
/* Order page styling */
body { background:#fff0f5; margin:0; padding:0; font-family:'Cormorant Garamond', serif; }
.container { max-width:900px; margin:20px auto; padding:20px; display:flex; flex-wrap:wrap; gap:20px; }
.left, .right { flex:1 1 400px; }
.left img { width:100%; border-radius:12px; }
.right { display:flex; flex-direction:column; gap:12px; }
label { font-weight:700; }
select,input { padding:8px; border-radius:8px; border:1px solid #ccc; width:100%; }
.total { font-weight:700; font-size:20px; color:hotpink; margin-top:10px; }
button { background:#ff66b2; color:white; padding:12px; border:none; border-radius:12px; font-weight:700; cursor:pointer; }
button:hover { background:#ff99cc; }

/* NAVBAR */
.site-nav {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 20px;
    background:#ffe6f0;
}
.logo { width:220px; border-radius:12px; }
.nav-links { display:flex; gap:15px; }
.nav-links a {
    text-decoration:none;
    color:#5c2a4d;
    font-weight:700;
    padding:6px 12px;
    border-radius:12px;
}
.nav-links a:hover { background:#ff99cc; color:white; }
</style>

</head>
<body>

<!-- NAVBAR -->
<nav class="site-nav">
    <a href="index.html"><img src="images/logo.png" alt="Logo" class="logo"></a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="buy.html">Buy</a>
        <a href="nail-sizing.html">Nail Sizing</a>
        <a href="custom-designs.html">Custom</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<div class="container">
    <div class="left">
        <img id="designImage" src="" alt="Design Image">
    </div>

    <div class="right">
        <h2 id="designName">Design Name</h2>

        <label>Nail Length:</label>
        <select id="length">
            <option value="XXS">XXS</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="MM">MM</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL (+$1)</option>
            <option value="XXXL">XXXL (+$2)</option>
        </select>

        <label>Nail Shape:</label>
        <select id="shape">
            <option value="rounded">Rounded</option>
            <option value="square">Square</option>
            <option value="almond">Almond</option>
            <option value="coffin">Coffin</option>
            <option value="stiletto">Stiletto</option>
        </select>

        <label>Full Name:</label>
        <input type="text" id="fullName" placeholder="Your full name">

        <label>Instagram or Email:</label>
        <input type="text" id="contact" placeholder="Your Instagram or Gmail" required>

        <div class="total">Total: $0</div>

        <button onclick="placeOrder()">Place Order</button>
    </div>
</div>

<!-- PRODUCT DATA -->
<script src="products.js"></script>

<script>
// Read URL params
const params = new URLSearchParams(window.location.search);
const designNameParam = params.get('design');

// Find product by name
const product = products.find(p => p.name === designNameParam);

// If product exists → update page
if (product) {
    document.getElementById("designName").textContent = product.name;
    document.getElementById("designImage").src = product.img;  // Already includes "images/"
}

// Price updates
const basePrice = product.price;
const lengthEl = document.getElementById("length");
const totalEl = document.querySelector(".total");

function updateTotal() {
    let price = basePrice;
    if (lengthEl.value === "XXL") price += 1;
    if (lengthEl.value === "XXXL") price += 2;
    totalEl.textContent = `Total: $${price}`;
}
lengthEl.addEventListener("change", updateTotal);
updateTotal();

// PLACE ORDER
function placeOrder() {
    const fullName = document.getElementById("fullName").value.trim();
    const contact = document.getElementById("contact").value.trim();
    const length = document.getElementById("length").value;
    const shape = document.getElementById("shape").value;

    if (!contact) return alert("Please enter your Instagram or Gmail.");

    const orderInfo = `
Design: ${product.name}
Price: ${totalEl.textContent}
Length: ${length}
Shape: ${shape}
Customer: ${fullName}
Contact: ${contact}
`;

    // SEND TO BACKEND
    fetch("https://order-backend-qesa.onrender.com/order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            customer_name: fullName,
            customer_email: contact,
            product: orderInfo
        })
    })
    .then(res => res.text())
    .then(() => {
        alert("ORDER SENT (Check your email or Instagram soon!)");
    })
    .catch(() => {
        alert("❌ Failed to send order. Please try again.");
    });
}
</script>

</body>
</html>
