<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Order - Lauryn's Lovely Nails</title>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
body {
    background-color: #fff0f5;
    font-family: 'Cormorant Garamond', serif;
    margin: 0;
    padding: 0;
}
.container {
    max-width: 1000px;
    margin: 20px auto;
    padding: 0 15px;
}
.site-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 0;
}
.site-nav .nav-links a {
    margin-left: 15px;
    text-decoration: none;
    color: #333;
    font-weight: 700;
}
.site-nav .nav-links a:hover {
    color: hotpink;
}
.order-page {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    margin-top: 30px;
}
.order-image img {
    max-width: 350px;
    border-radius: 15px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}
.order-form-container {
    flex: 1;
    min-width: 300px;
    background: #fff;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
}
h2 {
    color: hotpink;
    margin-top: 0;
}
form {
    display: flex;
    flex-direction: column;
    gap: 15px;
}
label {
    font-weight: bold;
}
input, select {
    padding: 10px;
    font-size: 1em;
    border-radius: 5px;
    border: 1px solid #ccc;
}
input:focus, select:focus {
    border-color: hotpink;
    outline: none;
}
.total {
    font-size: 1.3em;
    font-weight: bold;
    text-align: center;
    color: hotpink;
    margin-top: 10px;
}
.pink-button {
    background: hotpink;
    color: white;
    border: none;
    border-radius: 5px;
    padding: 12px;
    cursor: pointer;
    font-size: 1em;
    transition: background 0.2s, transform 0.2s;
}
.pink-button:hover {
    background: deeppink;
    transform: scale(1.05);
}
.footer {
    text-align: center;
    margin-top: 50px;
    padding: 15px 0;
}
.footer a {
    color: hotpink;
    text-decoration: none;
}
.footer a:hover {
    text-decoration: underline;
}
</style>
</head>
<body>
<div class="container">

<!-- NAV -->
<nav class="site-nav">
    <a href="index.html"><img src="logo.png" alt="Lauryn's Lovely Nails logo" class="logo"></a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="buy.html">Buy</a>
        <a href="nail-sizing.html">Nail Sizing</a>
        <a href="custom-designs.html">Custom</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<!-- ORDER PAGE -->
<div class="order-page">
    <!-- Left: Design Image -->
    <div class="order-image">
        <img id="designImage" src="" alt="">
    </div>

    <!-- Right: Order Form -->
    <div class="order-form-container">
        <h2 id="designName"></h2>
        <form id="orderForm">
            <label for="length">Nail Length:</label>
            <select id="length" required>
                <option value="XXS">XXS</option>
                <option value="XS">XS</option>
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="MM">MM</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
                <option value="XXL">XXL (+$1)</option>
                <option value="XXXL">XXXL (+$2)</option>
            </select>

            <label for="shape">Nail Shape:</label>
            <select id="shape" required>
                <option value="Rounded">Rounded</option>
                <option value="Square">Square</option>
                <option value="Almond">Almond</option>
                <option value="Coffin">Coffin</option>
                <option value="Stiletto">Stiletto</option>
            </select>

            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Your Full Name" required>

            <label for="contact">Instagram or Gmail:</label>
            <input type="text" id="contact" placeholder="@instagram or email" required>

            <div class="total">Total: $0</div>
            <button type="submit" class="pink-button">Send Order</button>
        </form>
    </div>
</div>

<!-- FOOTER -->
<footer class="footer">
<p>© 2025 Lauryn’s Lovely Nails · Handmade with love 💗 · <a href="contact.html" class="pink-link">DM to order</a></p>
<p class="muted">Sizing photos saved for repeat customers — saves time on future orders.</p>
</footer>

</div>

<script>
// Get URL parameters
const params = new URLSearchParams(window.location.search);
const designName = params.get('design');
const basePrice = parseFloat(params.get('price'));

// Set design name and image
document.getElementById('designName').textContent = designName;
document.getElementById('designImage').src = `images/${designName.toLowerCase().replace(/\s/g, '')}.png`;
document.getElementById('designImage').alt = designName;

// Elements
const lengthEl = document.getElementById('length');
const totalEl = document.querySelector('.total');

// Update total price
function updateTotal() {
    let price = basePrice;
    const length = lengthEl.value;
    if (length === "XXL") price += 1;
    if (length === "XXXL") price += 2;
    totalEl.textContent = `Total: $${price}`;
}
lengthEl.addEventListener('change', updateTotal);
updateTotal();

// Submit order
document.getElementById('orderForm').addEventListener('submit', e => {
    e.preventDefault();
    const orderData = {
        design: designName,
        length: lengthEl.value,
        shape: document.getElementById('shape').value,
        name: document.getElementById('name').value,
        contact: document.getElementById('contact').value,
        total: parseFloat(totalEl.textContent.replace("Total: $", ""))
    };

    fetch('http://localhost:3000/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(orderData)
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        document.getElementById('orderForm').reset();
        updateTotal();
    })
    .catch(err => {
        console.error('Error sending order:', err);
        alert('Something went wrong. Please try again.');
    });
});
</script>
</body>
</html>
