<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy Nails - Lauryn's Lovely Nails</title>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@300;400;700&display=swap" rel="stylesheet">
<style>
/* Override logo size for buy page */
.site-nav .logo {
    max-width: 220px; /* bigger logo */
    height: auto;
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="site-nav">
    <a href="index.html"><img src="images/logo.png" alt="Lauryn's Lovely Nails logo" class="logo"></a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="buy.html">Buy</a>
        <a href="nail-sizing.html">Nail Sizing</a>
        <a href="custom-designs.html">Custom</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<main>
<h2>Buy Our Nails</h2>
<p>Click “Buy” to select your options and place your order.</p>

<div class="product-grid">
    <!-- Product cards will be dynamically loaded here -->
</div>
</main>

<footer class="footer">
<p>© 2025 Lauryn’s Lovely Nails · <a href="contact.html" class="pink-link">DM to order</a></p>
</footer>

<!-- Products JS -->
<script src="products.js"></script>
<script>
const grid = document.querySelector('.product-grid');
grid.innerHTML = ""; // Clear any static HTML

products.forEach(product => {
  const card = document.createElement('div');
  card.classList.add('product-card');
  if(product.name.toLowerCase().includes("custom")) card.classList.add("custom");

  card.innerHTML = `
    <img src="${product.img}" alt="${product.name}" class="product-image">
    <p class="product-name">${product.name}</p>
    <a href="order.html?design=${encodeURIComponent(product.name)}&price=${product.price}&img=${product.img}" class="card-buy">Buy</a>
  `;

  grid.appendChild(card);
});
</script>

</body>
</html>
