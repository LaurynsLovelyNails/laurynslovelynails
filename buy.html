<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Buy Nails - Lauryn's Lovely Nails</title>
<link rel="stylesheet" href="styles.css">
<style>
/* Minimal styling for layout */
body { background:#fff0f5; font-family: 'Cormorant Garamond', serif; margin:0; padding:0; }
.site-nav { display:flex; justify-content:space-between; align-items:center; padding:15px; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
.site-nav .nav-links a { margin-left:15px; text-decoration:none; color:#333; font-weight:700; }
.site-nav .nav-links a:hover { color:hotpink; }
.product-grid { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; margin:30px auto; }
.product-card { background:#fff0f5; border-radius:15px; padding:10px; text-align:center; flex:1 1 200px; box-shadow:0 4px 10px rgba(0,0,0,0.1); transition: transform 0.2s; }
.product-card:hover { transform:scale(1.05); }
.product-image { width:100%; border-radius:12px; }
.product-name { font-weight:700; margin:8px 0; font-size:20px; }
.card-buy { display:inline-block; background:#ff66b2; color:#fff; padding:8px 16px; border-radius:12px; font-weight:700; text-decoration:none; }
.card-buy:hover { background:#ff99cc; }
</style>
</head>
<body>

<nav class="site-nav">
    <a href="index.html"><img src="logo.png" alt="Lauryn's Lovely Nails" style="height:50px;"></a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="buy.html">Buy</a>
        <a href="nail-sizing.html">Nail Sizing</a>
        <a href="custom-designs.html">Custom</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<main>
<h2 style="text-align:center; color:hotpink;">Buy Our Nails</h2>
<p style="text-align:center;">Click “Buy” to select your options and place your order.</p>

<div class="product-grid">
    <!-- Example design -->
    <div class="product-card">
        <img src="images/design1.png" alt="Pretty Little Lady" class="product-image">
        <p class="product-name">Pretty Little Lady</p>
        <a href="order.html?design=Pretty%20Little%20Lady&price=12&img=design1.png" class="card-buy">Buy</a>
    </div>
    <div class="product-card">
        <img src="images/design2.png" alt="Bubble Blossom" class="product-image">
        <p class="product-name">Bubble Blossom</p>
        <a href="order.html?design=Bubble%20Blossom&price=12&img=design2.png" class="card-buy">Buy</a>
    </div>
    <div class="product-card">
        <img src="images/design3.png" alt="Glitter Dream" class="product-image">
        <p class="product-name">Glitter Dream</p>
        <a href="order.html?design=Glitter%20Dream&price=13&img=design3.png" class="card-buy">Buy</a>
    </div>
    <!-- Add remaining designs the same way -->
</div>
</main>

</body>
</html>
